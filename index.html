<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>
    <p id="gameOverMessage"></p>
    <button id="restartButton">Restart</button>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();


function moveSnake() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            if (snake.some(segment => segment.x === head.x && segment.y === head.y) ||
             head.x <0 || head.x>=tileCount || head.y<0 || head.y >=tileCount){
                // Game over
                document.getElementById("gameOverMessage").innerText = "Game Over! Score: " + score;
                gameOver = true;
                return;
            }
            snake.unshift(head);
            if(head.x=== food.x && head.y===food.y){
                score++;
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                }
            }else{
            snake.pop();
            }
        }


        document.addEventListener("keydown", (event) => {
            let newDirection = null;
            switch (event.key) {
                case "ArrowUp":
                    newDirection = { x: 0, y: -1 };
                    break;
                case "ArrowDown":
                    newDirection = { x: 0, y: 1 };
                    break;
                case "ArrowLeft":
                    newDirection = { x: -1, y: 0 };
                    break;
                case "ArrowRight":
                    newDirection = { x: 1, y: 0 };
                    break;
            }
            if (newDirection.x !== -direction.x || newDirection.y !== -direction.y) {
                direction = newDirection;
            }
        });

        document.getElementById("restartButton").addEventListener("click", () => {
            snake =[
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            food = { x: 15, y: 15 };
            direction = { x: 1, y: 0 };
            score = 0;
            gameOver = false;
            document.getElementById("gameOverMessage").innerText = "";
        }); 

function gameLoop() {
        if (gameOver) return;
        moveSnake();
        drawGame();
        document.getElementById("info").innerText = "Score: " + score;
}       

setInterval (gameLoop, 200);

  

        
        

    </script>

</body>
</html>
